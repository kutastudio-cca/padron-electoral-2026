<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Padrón Electoral 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0ebe7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            padding: 40px 35px;
            max-width: 400px;
            width: 100%;
        }

        .login-container h1 {
            font-size: 24px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .login-container .subtitle span {
            color: #cc0000;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0d6d0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: #cc0000;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 6px;
        }

        .btn-login:hover {
            background: #a30000;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            background: #ffe5e5;
            color: #cc0000;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        .error-msg.active {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>🔐 Panel de Administración</h1>
        <p class="subtitle">Padrón Electoral <span>2026</span></p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="admin@padron.com" required />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn-login" id="loginBtn">🔑 Iniciar sesión</button>

            <div class="error-msg" id="errorMsg">❌ Credenciales incorrectas.</div>
            <div class="loading" id="loadingMsg">⏳ Verificando...</div>
        </form>
    </div>

    <script>
        // ===== CONFIGURACIÓN DE FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyAk2DoRWPRUuCl01bDX-iHWa6a56nOBzxU",
            authDomain: "padron-electoral-2026-32bc8.firebaseapp.com",
            projectId: "padron-electoral-2026-32bc8",
            storageBucket: "padron-electoral-2026-32bc8.firebasestorage.app",
            messagingSenderId: "143219673179",
            appId: "1:143219673179:web:9e318c173ed4558a99d77e"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ===== DOM =====
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loadingMsg = document.getElementById('loadingMsg');
        const loginForm = document.getElementById('loginForm');

        // ===== LOGIN =====
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                errorMsg.textContent = '❌ Completa todos los campos.';
                errorMsg.classList.add('active');
                return;
            }

            loginBtn.disabled = true;
            loadingMsg.classList.add('active');
            errorMsg.classList.remove('active');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error de login:', error);
                let mensaje = '❌ Credenciales incorrectas.';
                if (error.code === 'auth/user-not-found') {
                    mensaje = '❌ Usuario no encontrado.';
                } else if (error.code === 'auth/wrong-password') {
                    mensaje = '❌ Contraseña incorrecta.';
                } else if (error.code === 'auth/too-many-requests') {
                    mensaje = '❌ Demasiados intentos. Espera un momento.';
                }
                errorMsg.textContent = mensaje;
                errorMsg.classList.add('active');
                loginBtn.disabled = false;
                loadingMsg.classList.remove('active');
            }
        });

        // ===== VERIFICAR SESIÓN =====
        auth.onAuthStateChanged(function(user) {
            if (user) {
                window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
