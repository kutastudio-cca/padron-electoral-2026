<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padrón Electoral 2026</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>

    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f0ec;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #8b0000, #cc0000);
            color: white;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header h1 span {
            font-size: 40px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
            margin-top: 8px;
        }

        /* ===== CANDIDATOS ===== */
        .candidatos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            margin-top: 10px;
        }

        .candidato-card {
            background: white;
            border-radius: 16px;
            padding: 25px 20px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .candidato-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border-color: #cc0000;
        }

        .candidato-card .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #e0d6d0;
            object-fit: cover;
            margin: 0 auto 12px;
            display: block;
            transition: border-color 0.3s;
        }

        .candidato-card:hover .avatar {
            border-color: #cc0000;
        }

        .candidato-card .name {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .candidato-card .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
        }

        .candidato-card .btn-ingresar {
            display: inline-block;
            background: #cc0000;
            color: white;
            padding: 8px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
        }

        .candidato-card .btn-ingresar:hover {
            background: #a30000;
        }

        /* ===== ESTADO DE CARGA ===== */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .loading-state .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .loading-state .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #e0d6d0;
            border-top: 4px solid #cc0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 14px;
            border-top: 1px solid #e8e0da;
        }

        .footer strong {
            color: #cc0000;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .header h1 span {
                font-size: 30px;
            }

            .header p {
                font-size: 15px;
            }

            .candidatos-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .candidato-card {
                padding: 18px 14px 14px;
            }

            .candidato-card .avatar {
                width: 70px;
                height: 70px;
            }

            .candidato-card .name {
                font-size: 17px;
            }

            .candidato-card .btn-ingresar {
                padding: 6px 20px;
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .candidatos-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .candidato-card .avatar {
                width: 60px;
                height: 60px;
            }

            .candidato-card .name {
                font-size: 15px;
            }

            .candidato-card .btn-ingresar {
                padding: 5px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <h1>
                <span>🗳️</span> Padrón Electoral 2026
            </h1>
            <p>Selecciona tu candidato para buscar tu información</p>
        </header>

        <!-- ===== LISTA DE CANDIDATOS ===== -->
        <div id="candidatosContainer">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Cargando candidatos...</span>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            📌 Desarrollado por <strong>Kutastudio</strong> · Padrón Electoral 2026
        </footer>

    </div>

    <script>
        // ============================================================
        //  1. CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAk2DoRWPRUuCl01bDX-iHWa6a56nOBzxU",
            authDomain: "padron-electoral-2026-32bc8.firebaseapp.com",
            projectId: "padron-electoral-2026-32bc8",
            storageBucket: "padron-electoral-2026-32bc8.firebasestorage.app",
            messagingSenderId: "143219673179",
            appId: "1:143219673179:web:9e318c173ed4558a99d77e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        //  2. CARGAR CANDIDATOS
        // ============================================================
        const container = document.getElementById('candidatosContainer');

        async function cargarCandidatos() {
            try {
                // Obtener candidatos activos
                const snapshot = await db.collection('candidatos')
                    .where('activo', '==', true)
                    .get();

                const candidatos = [];
                snapshot.forEach(doc => {
                    candidatos.push({ id: doc.id, ...doc.data() });
                });

                if (candidatos.length === 0) {
                    container.innerHTML = `
                                <div class="loading-state">
                                    <span class="icon">📭</span>
                                    No hay candidatos disponibles.
                                    <br />
                                    <small style="color:#aaa;">Vuelve más tarde</small>
                                </div>
                            `;
                    return;
                }

                // Renderizar candidatos
                let html = '<div class="candidatos-grid">';

                candidatos.forEach(c => {
                    const color = c.color_principal || '#cc0000';
                    const imagen = c.imagen_url ||
                        `https://ui-avatars.com/api/?name=${encodeURIComponent(c.nombre)}&background=${color.replace('#', '')}&color=fff&size=128`;

                    html += `
                                <a href="/candidatos/${c.slug}/" class="candidato-card">
                                    <img class="avatar" src="${imagen}" alt="${c.nombre}" />
                                    <div class="name">${c.nombre}</div>
                                    <div class="subtitle">Concejal 2026-2031</div>
                                    <span class="btn-ingresar" style="background:${color};">🔍 Ingresar</span>
                                </a>
                            `;
                });

                html += '</div>';
                container.innerHTML = html;

            } catch (error) {
                console.error('Error al cargar candidatos:', error);
                container.innerHTML = `
                            <div class="loading-state">
                                <span class="icon">❌</span>
                                Error al cargar candidatos.
                                <br />
                                <small style="color:#aaa;">${error.message}</small>
                            </div>
                        `;
            }
        }

        // ============================================================
        //  3. INICIALIZAR
        // ============================================================
        cargarCandidatos();

        console.log('✅ Página de inicio cargada');
    </script>

</body>
</html>
