<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padrón Electoral - Pablo Alderete</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>

    <!-- html2canvas para compartir -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f0ec;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .candidate-header {
            background: var(--color-principal, #cc0000);
            color: white;
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
        }

        .candidate-header .candidate-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .candidate-header .candidate-name {
            font-size: 28px;
            font-weight: 700;
        }

        .candidate-header .candidate-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0d6d0;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
            min-width: 200px;
            background: white;
        }

        .search-box input:focus {
            border-color: var(--color-principal, #cc0000);
        }

        .search-box button {
            padding: 14px 35px;
            background: var(--color-principal, #cc0000);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: var(--color-secundario, #a30000);
        }

        .results {
            margin-top: 10px;
        }

        .voter-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            border: 1px solid #f0e6e0;
        }

        .voter-card .card-section {
            padding: 16px 20px;
            border-bottom: 1px solid #f5f0ec;
        }

        .voter-card .card-section:last-child {
            border-bottom: none;
        }

        .voter-card .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #8b0000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voter-card .person-name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .voter-card .person-cedula {
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
        }

        .voter-card .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 6px 20px;
        }

        .voter-card .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #333;
            padding: 2px 0;
        }

        .voter-card .detail-item .label {
            font-weight: 600;
            color: #666;
            min-width: 70px;
        }

        .voter-card .detail-item .value {
            color: #1a1a1a;
        }

        .family-block {
            margin-top: 12px;
        }

        .family-block .family-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .family-block .family-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .family-block .family-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: #faf7f5;
            border-radius: 8px;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 4px 10px;
        }

        .family-block .family-item .fam-name {
            font-weight: 500;
            color: #1a1a1a;
        }

        .family-block .family-item .fam-cedula {
            color: #666;
            font-size: 13px;
        }

        .family-block .family-item .fam-direccion {
            color: #888;
            font-size: 12px;
            width: 100%;
            padding-left: 4px;
        }

        .family-block .family-item .fam-badge {
            font-size: 11px;
            background: #e8e0da;
            padding: 1px 10px;
            border-radius: 12px;
            color: #555;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-data .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .no-results {
            text-align: center;
            padding: 30px 20px;
            color: #888;
            font-size: 16px;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .whatsapp-float.active {
            display: flex;
        }

        .whatsapp-float button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #25d366;
            color: white;
            border: none;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        .whatsapp-float button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-float button:active {
            transform: scale(0.95);
        }

        .whatsapp-float .tooltip {
            position: absolute;
            right: 70px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .whatsapp-float:hover .tooltip {
            opacity: 1;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        @media (max-width: 600px) {
            .candidate-header .candidate-image {
                width: 90px;
                height: 90px;
            }

            .candidate-header .candidate-name {
                font-size: 22px;
            }

            .voter-card .person-name {
                font-size: 18px;
            }

            .voter-card .detail-grid {
                grid-template-columns: 1fr;
            }

            .search-box input {
                min-width: 140px;
                font-size: 15px;
            }

            .search-box button {
                width: 100%;
                justify-content: center;
            }

            .family-block .family-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
            }

            .whatsapp-float {
                bottom: 20px;
                right: 20px;
            }

            .whatsapp-float button {
                width: 55px;
                height: 55px;
                font-size: 28px;
            }

            .whatsapp-float .tooltip {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .candidate-header .candidate-name {
                font-size: 18px;
            }

            .voter-card .person-name {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <header class="candidate-header" id="candidateHeader">
            <img class="candidate-image" id="candidateImage" src="candidato.jpg" alt="Pablo Alderete" />
            <div class="candidate-name" id="candidateName">Cargando...</div>
            <div class="candidate-subtitle">Concejal 2026-2031</div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por cédula..." />
            <button id="searchBtn">🔍 Buscar</button>
        </div>

        <div class="results" id="resultsContainer">
            <div class="no-data">
                <span class="icon">🔍</span>
                <p>Busca una cédula para ver los resultados</p>
            </div>
        </div>

        <div class="whatsapp-float" id="whatsappFloat">
            <button id="whatsappBtn" title="Compartir por WhatsApp">
                💬
            </button>
            <span class="tooltip">Compartir resultado</span>
        </div>

    </div>

    <script>
        // ============================================================
        //  1. CONFIGURACIÓN DE FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAk2DoRWPRUuCl01bDX-iHWa6a56nOBzxU",
            authDomain: "padron-electoral-2026-32bc8.firebaseapp.com",
            projectId: "padron-electoral-2026-32bc8",
            storageBucket: "padron-electoral-2026-32bc8.firebasestorage.app",
            messagingSenderId: "143219673179",
            appId: "1:143219673179:web:9e318c173ed4558a99d77e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        //  2. CONFIGURACIÓN DEL CANDIDATO
        // ============================================================
        const CANDIDATO_SLUG = 'pablo-alderete';

        // ============================================================
        //  3. DOM
        // ============================================================
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const whatsappFloat = document.getElementById('whatsappFloat');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const candidateHeader = document.getElementById('candidateHeader');
        const candidateImage = document.getElementById('candidateImage');
        const candidateName = document.getElementById('candidateName');

        let currentResult = null;
        let allPersonas = [];

        // ============================================================
        //  4. CARGAR DATOS DEL CANDIDATO (solo color y nombre desde Firestore)
        // ============================================================
        async function cargarCandidato() {
            try {
                const doc = await db.collection('candidatos').doc(CANDIDATO_SLUG).get();
                if (doc.exists) {
                    const data = doc.data();
                    candidateName.textContent = data.nombre || 'Pablo Alderete';

                    if (data.color_principal) {
                        candidateHeader.style.setProperty('--color-principal', data.color_principal);
                        candidateHeader.style.setProperty('--color-secundario', data.color_secundario || data
                        .color_principal);
                    }

                    document.title = `Padrón Electoral - ${data.nombre || 'Pablo Alderete'}`;
                } else {
                    candidateName.textContent = 'Pablo Alderete';
                }
            } catch (error) {
                console.error('Error al cargar candidato:', error);
                candidateName.textContent = 'Pablo Alderete';
            }
        }

        // ============================================================
        //  5. CARGAR PADRÓN CON CACHÉ LOCAL
        // ============================================================
        async function cargarPadron() {
            const CACHE_KEY = 'padron_cache_v1';
            const CACHE_EXPIRY = 24 * 60 * 60 * 1000; // 24 horas

            try {
                // 1. Intentar cargar desde caché
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    const timestamp = data.timestamp || 0;
                    const now = Date.now();

                    if (now - timestamp < CACHE_EXPIRY) {
                        allPersonas = data.personas;
                        console.log(`📊 ${allPersonas.length} personas cargadas desde caché local`);
                        actualizarInterfaz();
                        return;
                    }
                }

                // 2. Cargar desde Firebase
                console.log('⏳ Cargando datos desde Firebase...');
                const snapshot = await db.collection('padron_unificado').get();
                allPersonas = [];
                snapshot.forEach(doc => {
                    allPersonas.push({ id: doc.id, ...doc.data() });
                });

                // 3. Guardar en caché
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    personas: allPersonas
                }));

                console.log(`📊 ${allPersonas.length} personas cargadas desde Firebase y guardadas en caché`);
                actualizarInterfaz();

            } catch (error) {
                console.error('Error al cargar padrón:', error);
                resultsContainer.innerHTML = `
                            <div class="no-data">
                                <span class="icon">❌</span>
                                <p>Error al cargar los datos.</p>
                                <small style="color:#aaa;">${error.message}</small>
                            </div>
                        `;
            }
        }

        // ============================================================
        //  6. ACTUALIZAR INTERFAZ
        // ============================================================
        function actualizarInterfaz() {
            if (allPersonas.length === 0) {
                resultsContainer.innerHTML = `
                            <div class="no-data">
                                <span class="icon">📂</span>
                                <p>No hay datos cargados en el sistema.</p>
                                <small style="color:#aaa;">El administrador debe cargar el padrón.</small>
                            </div>
                        `;
            } else {
                resultsContainer.innerHTML = `
                            <div class="no-data">
                                <span class="icon">🔍</span>
                                <p>Busca una cédula para ver los resultados</p>
                                <small style="color:#aaa;">${allPersonas.length} personas registradas</small>
                            </div>
                        `;
            }
        }

        // ============================================================
        //  7. FUNCIONES DE FORMATO
        // ============================================================
        function formatSexo(sexo) {
            const s = String(sexo).toUpperCase().trim();
            if (s === 'F') return 'Femenino';
            if (s === 'M') return 'Masculino';
            return s || '-';
        }

        function formatPartido(partido) {
            if (!partido) return '-';
            let str = String(partido).trim();
            str = str.replace(/^\//, '').replace(/\/$/, '');
            const partes = str.split('/').filter(p => p.trim() !== '');
            if (partes.length === 0) return '-';
            return partes.join(' • ');
        }

        function calcularEdad(fechaNac) {
            if (!fechaNac) return '-';
            let fechaStr = String(fechaNac).trim();

            if (fechaStr.includes('-') && fechaStr.includes(':')) {
                const parts = fechaStr.split(' ');
                if (parts.length >= 2) {
                    fechaStr = parts[0];
                }
            }

            const dateParts = fechaStr.split('-');
            if (dateParts.length === 3) {
                const year = parseInt(dateParts[0]);
                const month = parseInt(dateParts[1]) - 1;
                const day = parseInt(dateParts[2]);

                if (!isNaN(year) && !isNaN(month) && !isNaN(day) &&
                    year >= 1900 && year <= 2100 &&
                    month >= 0 && month <= 11 &&
                    day >= 1 && day <= 31) {
                    const fecha = new Date(year, month, day);
                    const hoy = new Date();
                    let edad = hoy.getFullYear() - fecha.getFullYear();
                    const m = hoy.getMonth() - fecha.getMonth();
                    if (m < 0 || (m === 0 && hoy.getDate() < fecha.getDate())) {
                        edad--;
                    }
                    return edad >= 0 ? edad : '-';
                }
            }
            return '-';
        }

        function obtenerAnoInscripcion(fechaInsc) {
            if (!fechaInsc) return '-';
            let fechaStr = String(fechaInsc).trim();

            if (fechaStr.includes('-') && fechaStr.includes(':')) {
                const parts = fechaStr.split(' ');
                if (parts.length >= 2) {
                    fechaStr = parts[0];
                }
            }

            const dateParts = fechaStr.split('-');
            if (dateParts.length === 3) {
                const year = parseInt(dateParts[0]);
                if (!isNaN(year) && year >= 1900 && year <= 2100) {
                    return year;
                }
            }
            return '-';
        }

        function getLocalName(local) {
            const LOCAL_NAMES = {
                '2': 'Col. Mcal López',
                '1': 'Col. Ka\'arendy'
            };
            const key = String(local).trim();
            return LOCAL_NAMES[key] || `Local ${key}`;
        }

        // ============================================================
        //  8. BUSCAR PERSONA
        // ============================================================
        function buscarPersona(cedula) {
            return allPersonas.find(p => p.cedula === cedula);
        }

        // ============================================================
        //  9. MOSTRAR RESULTADOS
        // ============================================================
        function mostrarResultados(persona) {
            if (!persona) {
                resultsContainer.innerHTML = `
                            <div class="no-results">
                                ❌ No se encontró ninguna persona con esta cédula
                            </div>
                        `;
                whatsappFloat.classList.remove('active');
                currentResult = null;
                return;
            }

            currentResult = persona;
            whatsappFloat.classList.add('active');

            const localName = getLocalName(persona.local);
            const edad = calcularEdad(persona.fec_nac);
            const anoInscripcion = obtenerAnoInscripcion(persona.fec_inscri);
            const sexoFormateado = formatSexo(persona.sexo);
            const partidoFormateado = formatPartido(persona.partido);

            const parentescoDirecto = allPersonas.filter(p =>
                p.apellido === persona.apellido &&
                p.cedula !== persona.cedula
            );

            const posibleParentesco = allPersonas.filter(p =>
                p.cedula !== persona.cedula &&
                p.direccion && persona.direccion &&
                p.direccion === persona.direccion &&
                p.apellido !== persona.apellido
            );

            let html = `
                        <div class="voter-card">
                            <div class="card-section">
                                <div class="section-title">👤 INFORMACIÓN PERSONAL</div>
                                <div class="person-name">${persona.nombre} ${persona.apellido}</div>
                                <div class="person-cedula">🪪 Cédula: ${persona.cedula}</div>
                                <div class="detail-grid">
                                    <div class="detail-item"><span>⚧️</span> <span class="label">Sexo:</span> <span class="value">${sexoFormateado}</span></div>
                                    <div class="detail-item"><span>🎂</span> <span class="label">Edad:</span> <span class="value">${edad !== '-' ? edad + ' años' : '-'}</span></div>
                                    <div class="detail-item"><span>📅</span> <span class="label">Inscripción:</span> <span class="value">${anoInscripcion}</span></div>
                                    <div class="detail-item"><span>📌</span> <span class="label">Tipo:</span> <span class="value">${persona.tipoinscri || '-'}</span></div>
                                </div>
                            </div>

                            <div class="card-section">
                                <div class="section-title">📍 UBICACIÓN</div>
                                <div class="detail-grid">
                                    <div class="detail-item"><span>🏛️</span> <span class="label">Local:</span> <span class="value">${localName}</span></div>
                                    <div class="detail-item"><span>🗂️</span> <span class="label">Mesa:</span> <span class="value">${persona.mesa || '-'}</span></div>
                                    <div class="detail-item"><span>🔢</span> <span class="label">Orden:</span> <span class="value">${persona.orden || '-'}</span></div>
                                    <div class="detail-item" style="grid-column: 1 / -1;"><span>📮</span> <span class="label">Dirección:</span> <span class="value">${persona.direccion || '-'}</span></div>
                                </div>
                            </div>

                            <div class="card-section">
                                <div class="section-title">🗳️ PARTIDO</div>
                                <div class="detail-item">
                                    <span>📌</span>
                                    <span class="value" style="font-weight:500; font-size:15px;">${partidoFormateado}</span>
                                </div>
                            </div>
                        </div>
                    `;

            if (parentescoDirecto.length > 0) {
                html += `
                            <div class="family-block">
                                <div class="family-title">👨‍👩‍👧‍👦 Parentesco directo</div>
                                <div class="family-list">
                        `;
                parentescoDirecto.forEach(p => {
                    const pLocal = getLocalName(p.local);
                    html += `
                                <div class="family-item">
                                    <span class="fam-name">${p.nombre} ${p.apellido}</span>
                                    <span class="fam-cedula">🪪 ${p.cedula}</span>
                                    <span class="fam-badge">${pLocal}</span>
                                </div>
                            `;
                });
                html += `
                                </div>
                            </div>
                        `;
            }

            if (posibleParentesco.length > 0) {
                html += `
                            <div class="family-block">
                                <div class="family-title">🏠 Posible parentesco</div>
                                <div class="family-list">
                        `;
                posibleParentesco.forEach(p => {
                    const pLocal = getLocalName(p.local);
                    html += `
                                <div class="family-item">
                                    <span class="fam-name">${p.nombre} ${p.apellido}</span>
                                    <span class="fam-cedula">🪪 ${p.cedula}</span>
                                    <span class="fam-badge">${pLocal}</span>
                                    <span class="fam-direccion">📮 ${p.direccion}</span>
                                </div>
                            `;
                });
                html += `
                                </div>
                            </div>
                        `;
            }

            if (parentescoDirecto.length === 0 && posibleParentesco.length === 0) {
                html += `
                            <div class="family-block">
                                <div class="family-title">👤 Sin parentescos registrados</div>
                                <div style="color:#999; font-size:14px; padding:4px 0;">
                                    No se encontraron personas con parentesco directo o posible.
                                </div>
                            </div>
                        `;
            }

            resultsContainer.innerHTML = html;
        }

        // ============================================================
        //  10. COMPARTIR POR WHATSAPP
        // ============================================================
        function shareOnWhatsApp() {
            if (!currentResult) {
                alert('Primero realiza una búsqueda para compartir los resultados.');
                return;
            }

            const person = currentResult;
            const localName = getLocalName(person.local);

            let message = '📋 *Padrón Electoral Municipales 2026*\n\n';
            message += `Hola👋 Soy Pablo Alderete, estos son tus datos para el voto.🗳️\n\n`;
            message += `👤 *${person.nombre.toUpperCase()} ${person.apellido.toUpperCase()}*\n`;
            message += `🪪 Cédula: ${person.cedula}\n`;
            message += `📍 ${localName}\n`;
            message += `🗂️ Mesa: ${person.mesa || 'N/A'} | Orden: ${person.orden || 'N/A'}\n\n`;
            message += `Lista 1☝️, Opción 🔟 \n\n`;
            message += `🪪No olvides tu CI, estoy para ayudarte si lo necesitas\n\n`;
            message += `🔗 Compartido desde Padrón Electoral 2026`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
        }

        // ============================================================
        //  11. EVENTOS
        // ============================================================
        searchBtn.addEventListener('click', function() {
            const cedula = searchInput.value.trim();
            if (!cedula) {
                resultsContainer.innerHTML = `
                            <div class="no-results">
                                ⚠️ Ingresa una cédula para buscar.
                            </div>
                        `;
                return;
            }
            const persona = buscarPersona(cedula);
            mostrarResultados(persona);
        });

        searchInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });

        whatsappBtn.addEventListener('click', shareOnWhatsApp);

        // ============================================================
        //  12. INICIALIZAR
        // ============================================================
        async function init() {
            await cargarCandidato();
            await cargarPadron();
        }

        init();
        console.log('✅ Página de candidato cargada con imagen fija y caché local');
    </script>

</body>
</html>
